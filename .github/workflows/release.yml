name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version in x.y.z format"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use the numeric x.y.z format" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: swift test

      - name: Build release archive
        run: ./scripts/package-release.sh "${{ steps.version.outputs.value }}" "$GITHUB_RUN_NUMBER"

      - name: Generate Homebrew cask
        run: ./scripts/generate-cask.sh "$GITHUB_REPOSITORY" "${{ steps.version.outputs.value }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          tag="v${VERSION}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            git tag "$tag"
            git push origin "$tag"
          fi
          gh release create "$tag" dist/* --generate-notes --verify-tag
